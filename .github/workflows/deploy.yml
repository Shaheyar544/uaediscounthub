name: Deploy UAE Discount Hub to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "🚀 Starting automated deployment..."
            
            DOMAIN_DIR=~/domains/uaediscounthub.com
            SOURCE_DIR=$DOMAIN_DIR/hbuilds/last-source
            
            echo "📂 Target directory: $SOURCE_DIR"
            cd "$SOURCE_DIR"
            
            export PATH="/opt/alt/alt-nodejs22/root/usr/bin:$PATH"
            export RAYON_NUM_THREADS=1
            export UV_THREADPOOL_SIZE=1
            export NEXT_CPU_NUM=1
            
            echo "⬇️ Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Updating dependencies..."
            chmod -R +x node_modules/.bin 2>/dev/null || true
            npm install --production=false
            chmod -R +x node_modules/.bin 2>/dev/null || true
            
            echo "⚙️ Building Next.js application..."
            chmod -R +x node_modules/.bin 2>/dev/null || true
            node ./node_modules/next/dist/bin/next build --webpack
            
            echo "📁 Syncing to active server..."
            ACTIVE_NODEJS=$(readlink -f $DOMAIN_DIR/hbuilds/current)/nodejs
            cp -r .next/standalone/* "$ACTIVE_NODEJS/" 2>/dev/null || true
            cp -r public "$ACTIVE_NODEJS/" 2>/dev/null || true
            mkdir -p "$ACTIVE_NODEJS/.next"
            cp -r .next/static "$ACTIVE_NODEJS/.next/" 2>/dev/null || true
            mkdir -p "$ACTIVE_NODEJS/tmp"
            
            # Sync config package.json for Hostinger dashboard scanner
            cp package.json "$DOMAIN_DIR/hbuilds/config/" 2>/dev/null || true
            cp package-lock.json "$DOMAIN_DIR/hbuilds/config/" 2>/dev/null || true
            
            echo "🔄 Triggering LiteSpeed restart..."
            touch "$ACTIVE_NODEJS/tmp/restart.txt"
            
            echo "✅ Deployment completed successfully!"
