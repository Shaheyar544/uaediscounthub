name: Deploy UAE Discount Hub to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Starting automated deployment..."
            
            DOMAIN_DIR=~/domains/polished-mistyrose-chinchilla-82.hostingersite.com
            TARGET_DIR=$DOMAIN_DIR/hbuilds/source
            
            echo "📂 Target directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            export PATH="/opt/alt/alt-nodejs20/root/usr/bin:$PATH"
            export NEXT_CPU_NUM=1
            
            echo "⬇️ Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Updating dependencies..."
            chmod -R +x node_modules/.bin 2>/dev/null || true
            npm install --production=false
            chmod -R +x node_modules/.bin 2>/dev/null || true
            
            echo "⚙️ Building Next.js application..."
            node ./node_modules/next/dist/bin/next build --webpack
            
            echo "📁 Copying assets to standalone..."
            cp -r public .next/standalone/ 2>/dev/null || true
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
            mkdir -p .next/standalone/tmp
            
            echo "🔄 Restarting application..."
            touch .next/standalone/tmp/restart.txt
            
            echo "✅ Deployment completed successfully!"
